version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledgerlens-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=2
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8501,http://localhost:3000
      - MAX_UPLOAD_BYTES=10485760
      - RATE_LIMIT=60/minute
      - LOG_LEVEL=INFO
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledgerlens-streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
    depends_on:
      backend:
        condition: service_healthy
